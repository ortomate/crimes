name: False positive
description: crimes flagged something that isn't a real risk
title: "[FP] <detector_id>: one-line summary"
labels: ["false-positive", "calibration"]
body:
  - type: markdown
    attributes:
      value: |
        False positives are the single most useful thing you can report —
        detector thresholds are calibrated against them.

        If you already ran `crimes feedback <fingerprint> --verdict fp
        --note "..."`, the export below is the fastest way to send it.
        That command also silences the finding locally, so you don't
        have to wait for a fix.

  - type: textarea
    id: feedback-export
    attributes:
      label: Feedback export (preferred)
      description: |
        Output of `crimes feedback export --format md`. Redact anything
        you don't want public — file paths and code snippets are the
        parts we actually need.
      render: markdown
    validations:
      required: false

  - type: input
    id: detector
    attributes:
      label: Detector id
      description: e.g. `large_function.js`, `todo_density`. Shown as `id=` in scan output.
      placeholder: large_function.js
    validations:
      required: true

  - type: textarea
    id: finding
    attributes:
      label: The finding
      description: Paste the finding, ideally from `crimes explain <id>`.
      render: text
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why it isn't a real risk
      description: |
        The important part. What does the code actually do that makes
        this finding wrong or not worth acting on?
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: crimes version
      description: Output of `crimes --version`.
      placeholder: 0.12.1
    validations:
      required: true
