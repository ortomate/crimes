name: evals-pr-replay

# Triggers on changes to detector / scoring / language / CLI code —
# on the PR, on the push if it lands on main without one, and on demand.
# Replays the structural rubric over already-committed agent outputs
# in `evals/results/<latest-version>/` against the PR's crimes build,
# then posts (or updates) a single PR comment with the diff summary.
#
# This workflow never invokes a real agent — fresh agent runs happen
# on the maintainer's machine using the `claude` and `codex` CLIs
# against their existing subscriptions (see evals/README.md). CI's job
# is regression detection on top of the pinned results, with no API
# keys + no per-call billing involved.
#
# Security: the only user-controllable input we read is `context.issue`
# (numeric PR id from GitHub Actions runtime) — no PR title/body/etc.
# is interpolated into shell commands. The diff-summary.md body is
# generated from our own scoring outputs, not from PR content.

# `pull_request` alone meant this gate could go an arbitrarily long time
# without ever running: it had not executed once between the 0.25.4
# regression that broke it and the 0.26.0 fix, because nothing in that
# window arrived as a qualifying PR. A gate that only runs on one event
# shape is a gate that silently does not cover the others — so `push` to
# main covers work that lands without a PR, and `workflow_dispatch`
# makes it runnable on demand rather than only as a side effect.
#
# The workflow keeps its `evals-pr-replay` name so existing branch
# protection and check references keep resolving.
on:
  pull_request:
    branches: [main]
    paths:
      - "packages/core/src/detectors/**"
      - "packages/core/src/scoring/**"
      - "packages/language-js/src/**"
      - "packages/cli/src/**"
      - "evals/**"
  # Duplicated rather than aliased: the Actions workflow parser does not
  # support YAML anchors. Keep the two lists in step.
  push:
    branches: [main]
    paths:
      - "packages/core/src/detectors/**"
      - "packages/core/src/scoring/**"
      - "packages/language-js/src/**"
      - "packages/cli/src/**"
      - "evals/**"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evals-replay:
    name: Replay pinned eval results
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Build
        run: pnpm run build

      # Fixtures 02-04 are OSS bodies cloned at a pinned SHA and are
      # gitignored (see .gitignore) — a fresh checkout has only each
      # fixture's `.crimes-eval-meta.json`. Without this step every scan
      # below runs against an empty directory, so every scenario reports
      # its expected findings as "not in fixture scan" and the failure
      # reads like a detector regression rather than a missing clone.
      # `evals:setup` is idempotent: a body already present is skipped.
      - name: Materialise the pinned OSS fixture bodies
        run: pnpm run evals:setup

      - name: Verify every scenario's expected findings actually fire on its fixture
        # Fails the PR if a scenario references a detector type that
        # `crimes scan` doesn't produce on the scenario's fixture. Catches
        # scenario/fixture drift before it shows up as a silent pass-rate
        # regression in the replay step below.
        #
        # Exits 1 on scenario drift and 2 when the environment is wrong —
        # including a fixture that is still missing after the step above,
        # which used to be skipped silently and counted as a pass.
        run: pnpm --filter evals-runner evals:verify-scenarios

      # The two steps below are this workflow's whole purpose, and both
      # used to exit 0 while doing nothing: `evals:replay` re-scored zero
      # files because it pinned whichever results directory sorted newest
      # (ranking-only since 0.25.4), and `evals:diff` then reported its own
      # input missing — also with exit 0. The job went green having measured
      # nothing, and the PR comment step ran on top of that.
      #
      # Both now exit 2 rather than 0 when there is nothing to measure, so
      # this job fails instead of certifying a replay that did not happen.
      # `evals/runner/src/harness-guards.test.ts` spawns the real scripts
      # and asserts those exit codes. Neither command fails on a pass-rate
      # regression — that stays signal, reported in the comment below.
      - name: Replay pinned results (no agent invocations)
        run: pnpm run evals:replay

      - name: Diff replay vs pinned summary
        run: pnpm run evals:diff

      # Only a pull_request event has an issue number to comment on.
      # On push / workflow_dispatch the steps above are the whole gate,
      # and the summary is in the job log.
      - name: Post / update PR comment with diff summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const path = require("path");
            const summaryPath = path.join(
              process.env.GITHUB_WORKSPACE,
              "evals",
              "diff-summary.md",
            );
            if (!fs.existsSync(summaryPath)) {
              core.info("No diff summary written — skipping PR comment.");
              return;
            }
            const body =
              "<!-- crimes-evals-replay -->\n" +
              fs.readFileSync(summaryPath, "utf8");
            const { owner, repo, number } = context.issue;
            const existing = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: number,
            });
            const prior = existing.data.find((c) =>
              c.body && c.body.includes("<!-- crimes-evals-replay -->"),
            );
            if (prior) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: prior.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: number,
                body,
              });
            }
