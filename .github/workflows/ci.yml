name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: install · build · typecheck · test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # Version comes from `packageManager` in root package.json.

      # One Node, and it is the one this project is developed on — see
      # `.nvmrc`. The matrix this replaces ran Node 20 and 22: 20 reached
      # end-of-life in April 2026 and 22 is mid-LTS, so the pair tested a
      # dead runtime and an ageing one while nothing exercised the
      # version anybody actually runs. A matrix earns its cost when the
      # legs can disagree; these two only ever agreed, and four steps
      # below carried `if: matrix.node == '22'` purely to avoid doing the
      # same work twice.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Formatting and lint run before the build so a style-only failure
      # reports in seconds instead of after the full tsup + vitest pass.
      - name: Format check
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Smoke test scan (human)
        run: node packages/cli/dist/index.js scan examples/messy-ts-app --no-color

      - name: Smoke test scan (json)
        run: |
          node packages/cli/dist/index.js scan examples/messy-ts-app --format json > /tmp/report.json
          node -e "const r=JSON.parse(require('fs').readFileSync('/tmp/report.json','utf8')); if(!r.schema_version||!Array.isArray(r.findings))process.exit(1); console.log('schema',r.schema_version,'findings',r.findings.length)"

      # The website pulls in Astro 6, which requires Node >=22.12 — a
      # floor the single version above clears comfortably.
      - name: Build website (landing + /docs Starlight site)
        run: pnpm --filter @crimes/website build

      - name: Verify /docs/ tree contains every expected page
        run: node apps/website/scripts/verify-build.mjs

  publish-smoke:
    name: publish smoke (pack + install + run)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # Version comes from `packageManager` in root package.json.

      - uses: actions/setup-node@v4
        with:
          # This job validates the *published* artifact, so it runs the
          # same Node as everything else rather than a second opinion.
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish smoke (build, pack, install tarball, run)
        run: pnpm run smoke
