# Copy to .github/workflows/crimes.yml. Review the pinned CLI version on upgrades.
# This gate compares committed PR changes; it excludes uncommitted working-tree edits.
name: crimes

on:
  pull_request:

jobs:
  crimes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout both compared refs
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install crimes
        run: npm install -g crimes@0.28.2

      - name: Gate on new high findings
        env:
          CRIMES_BASE: origin/${{ github.base_ref }}
        run: crimes verdict --base "$CRIMES_BASE" --fail-on new-high --format json

      # Alternative: all eligible findings in changed files, including old debt.
      # - run: crimes scan --changed --base "$CRIMES_BASE" --fail-on high --format json
      #   env:
      #     CRIMES_BASE: origin/${{ github.base_ref }}
      #
      # Alternative: findings absent from the committed, reviewed baseline.
      # - run: crimes baseline check --fail-on medium --format json
